[package]
name = "fifi"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["Stefan Schönberger <stefan@sniner.dev>"]
license = "GPL-3.0-or-later"
description = "Find identical files in subdirectories"
repository = "https://github.com/sniner/fifi"
homepage = "https://github.com/sniner/fifi"
keywords = ["duplicates", "deduplication", "filesystem", "cli"]
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
nix = { version = "0.29", features = ["signal"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
assert_cmd = "2"
nix = { version = "0.29", features = ["user"] }
predicates = "3"
tempfile = "3"
